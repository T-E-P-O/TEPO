services:
  db:
    image: postgres:16-alpine
    container_name: tepo-db
    environment:
      POSTGRES_DB: tepo
      POSTGRES_USER: tepo
      POSTGRES_PASSWORD: tepo
    ports:
      - "5432:5432"
    volumes:
      - tepo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tepo"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: ./backend
    container_name: tepo-backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/tepo
      DB_USERNAME: tepo
      DB_PASSWORD: tepo
      SPRING_PROFILES_ACTIVE: demo
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/scenarios/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  frontend:
    build: ./frontend
    container_name: tepo-frontend
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  tepo-db-data: